# Services d'infrastructure pour le développement local et la CI (jamais en production).
# Les identifiants ci-dessous sont des valeurs de dev locales, sans valeur ailleurs.
name: kaxolax

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: kaxolax
      POSTGRES_PASSWORD: kaxolax
      POSTGRES_DB: kaxolax
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'kaxolax', '-d', 'kaxolax']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.8.3-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Stockage compatible S3 (remplace MinIO, voir docs/decisions.md).
  s3:
    image: chrislusf/seaweedfs:4.48
    command:
      - server
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -dir=/data
      - -ip.bind=0.0.0.0
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - s3-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 2s
      timeout: 3s
      retries: 60

  # Crée les buckets (idempotent), puis applique CORS et expiration. S'arrête une fois terminé.
  s3-init:
    image: amazon/aws-cli:2.37.7
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ['/bin/bash', '/init/init-buckets.sh']
    environment:
      AWS_ACCESS_KEY_ID: kaxolax
      AWS_SECRET_ACCESS_KEY: kaxolax-local-secret
      AWS_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET_PROJECT_FILES: kaxolax-project-files
      S3_BUCKET_COMPILE_OUTPUTS: kaxolax-compile-outputs
      WEB_ORIGIN: http://localhost:3000
    volumes:
      - ./docker/s3-init:/init:ro
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.31.3
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_MAX_MESSAGES: '5000'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  s3-data:
