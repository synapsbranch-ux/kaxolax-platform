name: images

# Images Docker, construites et testées en linux/amd64 sans rien pousser ni déployer :
# - services : docker/Dockerfile construit comme Railway le construit (sans --target, étape finale
#   `service` choisie par KAXOLAX_SERVICE) pour web, admin, api et realtime, plus les cibles
#   compile-gateway et compile-agent ; chaque image démarre avec la commande et la sonde de santé
#   de deploy/railway/<service>.json (scripts/ci/service-smoke-test.mjs) ;
# - conteneur de compilation Cloudflare : construit sur l'image TeX Live publiée, puis compilation
#   réelle, \input hors du projet et suite malveillante par son API HTTP
#   (scripts/ci/container-compile-test.mjs). L'image déployée est construite par `wrangler deploy`.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - docker/**
      - apps/**
      - packages/**
      - functions/**
      - deploy/railway/**
      - docker-compose.yml
      - scripts/ci/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .dockerignore
      - .nvmrc
      - .github/workflows/images.yml

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: service images (amd64, Railway build and start)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Railway ne passe pas de --target : l'étape finale `service` reprend KAXOLAX_SERVICE.
      - name: Build (Railway services)
        run: |
          for svc in web admin api realtime; do
            docker build --platform linux/amd64 -f docker/Dockerfile \
              --build-arg KAXOLAX_SERVICE="$svc" -t "kaxolax/$svc:${GITHUB_SHA}" .
          done
      - name: Build (compile-gateway, compile-agent)
        run: |
          for target in compile-gateway compile-agent; do
            docker build --platform linux/amd64 -f docker/Dockerfile --target "$target" \
              --build-arg KAXOLAX_SERVICE="$target" -t "kaxolax/$target:${GITHUB_SHA}" .
          done
          docker images 'kaxolax/*'

      - run: docker compose up -d --wait postgres redis s3 s3-init
      - name: Smoke test (start command and health check of each image)
        run: >-
          node scripts/ci/service-smoke-test.mjs --tag "$GITHUB_SHA"
          web admin api realtime compile-gateway compile-agent
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  # Conteneur de compilation Cloudflare (linux/amd64, imposé par Cloudflare Containers) sur l'image
  # TeX Live publiée par kaxolax-texlive-images (argument TEXLIVE_IMAGE du Dockerfile).
  # L'agent tourne sous tini (PID 1 qui réclame les orphelins) ; la base est l'image durcie,
  # épinglée par son empreinte.
  compile-container:
    name: compile container (amd64, real compiles and malicious suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_BUILDKIT: '1'
      KAXOLAX_REQUIRE_PANDOC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Build
        run: >-
          docker build --platform linux/amd64 -f apps/compile-worker/container/Dockerfile
          -t "kaxolax/compile-container:${GITHUB_SHA}" .
      - name: Real compiles, \input outside the project and malicious suite
        run: node scripts/ci/container-compile-test.mjs --image "kaxolax/compile-container:${GITHUB_SHA}"
