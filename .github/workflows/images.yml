name: images

# Images Docker des services (docker/Dockerfile) : construites et testées (smoke test) pour
# vérifier le Dockerfile, en linux/amd64 comme Railway, qui les construit lui-même au
# déploiement. Rien n'est poussé ni déployé d'ici (décisions C.1 et C.2 : pas de staging,
# plus d'AWS). Le conteneur de compilation Cloudflare est vérifié de la même façon.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - docker/**
      - apps/**
      - packages/**
      - functions/**
      - pnpm-lock.yaml
      - .github/workflows/images.yml

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          for target in web api realtime compile-gateway compile-agent; do
            docker build --platform linux/amd64 -f docker/Dockerfile --target "$target" \
              -t "kaxolax/$target:${GITHUB_SHA}" .
          done
          docker images 'kaxolax/*'

      - name: Smoke test
        run: |
          docker run --rm "kaxolax/web:${GITHUB_SHA}" node -e "require('fs').accessSync('apps/web/server.js')"
          docker run --rm "kaxolax/api:${GITHUB_SHA}" node -e "require('fs').accessSync('build/bin/server.js')"
          for target in realtime compile-gateway compile-agent; do
            docker run --rm "kaxolax/$target:${GITHUB_SHA}" node -e "require('fs').accessSync('dist/main.js')"
          done

  # Conteneur de compilation Cloudflare (linux/amd64, imposé par Cloudflare Containers) : construit
  # pour vérifier le Dockerfile ; l'image publiée est construite et poussée par `wrangler deploy`.
  # Production (Railway) : Railway construit lui-même web, api et realtime depuis docker/Dockerfile.
  compile-container:
    name: build compile container (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: >-
          docker build --platform linux/amd64 -f apps/compile-worker/container/Dockerfile
          -t kaxolax/compile-container:${{ github.sha }} .
      - name: Smoke test
        run: >-
          docker run --rm --entrypoint node kaxolax/compile-container:${{ github.sha }}
          -e "require('fs').accessSync('/opt/kaxolax/agent/dist/container-main.js')"
