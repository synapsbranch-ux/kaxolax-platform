name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: format, lint, typecheck, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # PostgreSQL, Redis et S3 (buckets créés par s3-init) pour les tests de l'API et du temps réel.
      - run: docker compose up -d --wait postgres redis s3 s3-init
      - run: pnpm check

  local-stack:
    name: docker compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: docker compose up -d --wait
      - run: node scripts/check-local-stack.mjs
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  # Sauvegardes PostgreSQL : image du job cron (plateforme du runner), sauvegarde chiffrée,
  # rétention et test de restauration sur la pile locale (S3 SeaweedFS à la place de R2) ;
  # test-local.sh vérifie aussi les empreintes des binaires de chaque architecture (amd64, arm64).
  backup:
    name: postgres backup and restore test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SHELLCHECK_IMAGE: koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d # v0.11.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" -x scripts/backup/*.sh
      - run: docker compose up -d --wait postgres s3 s3-init
      - run: scripts/backup/test-local.sh
      - if: always()
        run: docker compose down -v

  # Agent de compilation avec un vrai Docker et l'image TeX Live publiée par kaxolax-texlive-images
  # (sous runc puis sous gVisor), puis parcours Playwright de la « Définition de terminé » sur la
  # pile locale complète.
  integration:
    name: compile agent (runc, gVisor) and definition of done
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TEXLIVE_IMAGE: ghcr.io/synapsbranch-ux/kaxolax-texlive:2026-medium
      GVISOR_RELEASE: '20260928.0'
      KAXOLAX_REQUIRE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install gVisor
        run: |
          url="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/$(uname -m)"
          workdir=$(mktemp -d)
          curl -fsSL -o "$workdir/gvisor.tar.bz2" "$url/gvisor.tar.bz2"
          curl -fsSL -o "$workdir/gvisor.tar.bz2.sha512" "$url/gvisor.tar.bz2.sha512"
          (cd "$workdir" && sha512sum --check gvisor.tar.bz2.sha512 && tar -xjf gvisor.tar.bz2)
          sudo install -m 0755 "$workdir/runsc" "$workdir/containerd-shim-runsc-v1" /usr/local/bin/
          sudo install -d /usr/local/bin/gvisor-bin
          sudo install -m 0755 "$workdir"/gvisor-bin/* /usr/local/bin/gvisor-bin/
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          runsc --version

      - name: Pull the TeX Live image
        run: |
          docker pull --quiet "$TEXLIVE_IMAGE"
          docker tag "$TEXLIVE_IMAGE" kaxolax-texlive:2026-medium

      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: pnpm build

      - name: Compile agent integration tests (runc)
        run: pnpm --filter @kaxolax/compile-agent test:integration
      - name: Compile agent integration tests (gVisor)
        env:
          COMPILE_RUNTIME: runsc
        run: pnpm --filter @kaxolax/compile-agent test:integration

      # Instance Clerk de développement : sans ces secrets, le parcours ne peut pas créer de compte.
      - name: Check the Clerk secrets
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
        run: |
          for name in CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY CLERK_JWT_KEY; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Repository secret $name is missing (Clerk development instance, see README)"
              exit 1
            fi
          done

      - name: Start the stack
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
        # API, temps réel, web, admin, agent (401 sans jeton : il répond) et gateway, qui doit voir
        # l'agent disponible (jeton interne de développement, lu dans son .env.example).
        run: |
          pnpm --filter @kaxolax/api migrate
          nohup pnpm dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          token="$(sed -n 's/^INTERNAL_TOKEN=//p' apps/compile-gateway/.env.example)"
          for _ in $(seq 1 90); do
            if curl -fs -o /dev/null http://localhost:3333/api/v1/health &&
              curl -fs -o /dev/null http://localhost:1234/health &&
              curl -fs -o /dev/null http://localhost:3000/healthz &&
              curl -fs -o /dev/null http://localhost:3001/healthz &&
              curl -s -o /dev/null http://localhost:3200/health &&
              curl -fs -H "x-internal-token: $token" http://localhost:3100/health |
              grep -q '"available":true'; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 "$RUNNER_TEMP/dev.log"
          exit 1

      - run: pnpm --filter @kaxolax/web exec playwright install --with-deps chromium
      - run: pnpm --filter @kaxolax/web e2e
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      - if: failure()
        run: tail -n 300 "$RUNNER_TEMP/dev.log" || true

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE"
          git /repo --redact --verbose --exit-code 1

  # Workflows (actionlint, qui passe aussi shellcheck sur les blocs `run`) et Dockerfiles (hadolint).
  ci-lint:
    name: workflows and Dockerfiles (actionlint, hadolint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
      HADOLINT_IMAGE: hadolint/hadolint@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e # v2.14.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color
      - run: >-
          git ls-files -z -- '*Dockerfile' |
          xargs -0 docker run --rm -v "$PWD:/repo:ro" -w /repo "$HADOLINT_IMAGE" hadolint

  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
