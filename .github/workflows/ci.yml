name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: format, lint, typecheck, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # PostgreSQL, Redis et S3 (buckets créés par s3-init) pour les tests de l'API et du temps réel.
      - run: docker compose up -d --wait postgres redis s3 s3-init
      - run: pnpm check

  local-stack:
    name: docker compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: docker compose up -d --wait
      - run: node scripts/check-local-stack.mjs
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  # Agent de compilation avec un vrai Docker et l'image TeX Live publiée par kaxolax-texlive-images
  # (sous runc puis sous gVisor), puis parcours Playwright de la « Définition de terminé » sur la
  # pile locale complète.
  integration:
    name: compile agent (runc, gVisor) and definition of done
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TEXLIVE_IMAGE: ghcr.io/synapsbranch-ux/kaxolax-texlive:2026-medium
      GVISOR_RELEASE: '20260928.0'
      KAXOLAX_REQUIRE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install gVisor
        run: |
          url="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/$(uname -m)"
          workdir=$(mktemp -d)
          curl -fsSL -o "$workdir/gvisor.tar.bz2" "$url/gvisor.tar.bz2"
          curl -fsSL -o "$workdir/gvisor.tar.bz2.sha512" "$url/gvisor.tar.bz2.sha512"
          (cd "$workdir" && sha512sum --check gvisor.tar.bz2.sha512 && tar -xjf gvisor.tar.bz2)
          sudo install -m 0755 "$workdir/runsc" "$workdir/containerd-shim-runsc-v1" /usr/local/bin/
          sudo install -d /usr/local/bin/gvisor-bin
          sudo install -m 0755 "$workdir"/gvisor-bin/* /usr/local/bin/gvisor-bin/
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          runsc --version

      - name: Pull the TeX Live image
        run: |
          docker pull --quiet "$TEXLIVE_IMAGE"
          docker tag "$TEXLIVE_IMAGE" kaxolax-texlive:2026-medium

      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: pnpm build

      - name: Compile agent integration tests (runc)
        run: pnpm --filter @kaxolax/compile-agent test:integration
      - name: Compile agent integration tests (gVisor)
        env:
          COMPILE_RUNTIME: runsc
        run: pnpm --filter @kaxolax/compile-agent test:integration

      # Instance Clerk de développement : sans ces secrets, le parcours ne peut pas créer de compte.
      - name: Check the Clerk secrets
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
        run: |
          for name in CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY CLERK_JWT_KEY; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Repository secret $name is missing (Clerk development instance, see README)"
              exit 1
            fi
          done

      - name: Start the stack
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
          AUTH_MODE: clerk
        run: |
          pnpm --filter @kaxolax/api migrate
          nohup pnpm dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fs -o /dev/null http://localhost:3333/api/v1/health &&
              curl -fs -o /dev/null http://localhost:1234/health &&
              curl -fs -o /dev/null http://localhost:3000/healthz &&
              curl -s -o /dev/null http://localhost:3200/health; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 "$RUNNER_TEMP/dev.log"
          exit 1

      - run: pnpm --filter @kaxolax/web exec playwright install --with-deps chromium
      - run: pnpm --filter @kaxolax/web e2e
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      - if: failure()
        run: tail -n 300 "$RUNNER_TEMP/dev.log" || true

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1

  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
