packages:
  - apps/*
  - functions/*
  - packages/*

# Toutes les versions sont exactes et centralisées ici (voir docs/decisions.md).
savePrefix: ''
engineStrict: true
# Une version publiée depuis moins de 24 h n'est pas installée (protection supply chain).
minimumReleaseAge: 1440

catalog:
  '@commitlint/cli': 21.2.3
  '@commitlint/config-conventional': 21.2.3
  '@eslint/js': 10.0.1
  '@types/node': 24.19.0
  eslint: 10.11.0
  eslint-config-prettier: 10.1.8
  globals: 17.12.0
  prettier: 3.9.9
  turbo: 2.11.5
  typescript: 6.0.3
  typescript-eslint: 8.71.0
  vitest: 5.0.2
  zod: 4.6.5
