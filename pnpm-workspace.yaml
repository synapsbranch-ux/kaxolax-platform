packages:
  - apps/*
  - functions/*
  - packages/*

# Toutes les versions sont exactes et centralisées ici (voir docs/decisions.md).
savePrefix: ''
engineStrict: true
# Une version publiée depuis moins de 24 h n'est pas installée (protection supply chain).
minimumReleaseAge: 1440
# Scripts d'installation : refusés par défaut. esbuild (via tsx et wrangler), @swc/core (via
# AdonisJS) et workerd (via wrangler) n'en ont pas besoin, leur binaire vient d'une dépendance
# optionnelle par plateforme.
allowBuilds:
  '@swc/core': false
  esbuild: false
  workerd: false

